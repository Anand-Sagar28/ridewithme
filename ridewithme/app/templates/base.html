<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RideWithMe</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <div class="nav-inner">
        <a class="brand" href="/">
          <span class="brand-mark">RW</span>
          <span class="brand-name">RideWithMe</span>
        </a>

        <div class="nav-links">
          <a href="/#rides">Rides</a>
          <a href="/#how">How It Works</a>
          <a href="/#safety">Safety</a>
          <a href="/#faq">FAQ</a>
        </div>

        <div class="nav-actions">
          {% if session.get("user_id") %}
            <a class="btn btn-ghost" href="/logout">Logout</a>
          {% else %}
            <a class="btn btn-ghost" href="/login">Login</a>
            <a class="btn" href="/register">Register</a>
          {% endif %}
        </div>
      </div>
    </nav>
  </header>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div>
        <div class="brand footer-brand">
          <span class="brand-mark">RW</span>
          <span class="brand-name">RideWithMe</span>
        </div>
        <p class="muted">Local rides, real people, and safer shared commutes.</p>
      </div>
      <div class="footer-links">
        <a href="/#rides">Upcoming Rides</a>
        <a href="/#how">How It Works</a>
        <a href="/#safety">Safety</a>
        <a href="/#faq">FAQ</a>
      </div>
      <div class="footer-cta">
        <p class="muted">Ready to ride?</p>
        <a class="btn" href="/#rides">Find a Ride</a>
      </div>
    </div>
  </footer>
</body>
</html>
